[project]
name = "backend"
version = "0.1.0"
description = "Data Center Stocks backend — FastAPI + SQLAlchemy taxonomy/ingestion API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0,<2.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
