# Two-service SQLite MVP shape — no `db` container (RESEARCH.md, PROJECT.md
# SQLite-first decision). Coolify auto-creates a shared network per compose
# stack, so no explicit `networks:` block is declared.
#
# Production shape (plan 05): neither service publishes a host port in this
# file. Coolify assigns the public domain and terminates TLS via its reverse
# proxy on `frontend` only (Coolify Dashboard -> the stack -> frontend
# service -> Domains); `backend` never gets a domain assigned and is
# reachable only over the stack's internal Docker network at
# http://backend:8000 — that's the practical access control for an API with
# no application-level auth (see docs/deployment.md and the phase threat
# model, T-01-20).
#
# Local development: with no `ports:` mapping, `docker compose up --build`
# still brings both services up on the shared internal network, but they
# are not reachable via `curl localhost:...` from the host. To smoke-test
# the containers directly, use `docker compose exec backend curl -f
# http://localhost:8000/health` / `docker compose exec frontend wget -qO-
# http://localhost:3000`. For day-to-day development, running the backend
# and frontend directly on the host (see README.md) is simpler than
# rebuilding containers on every change.
services:
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/app.db}
      - EDGAR_USER_AGENT=${EDGAR_USER_AGENT}
    volumes:
      # Named volume, NOT a bind mount to ./data. A relative bind mount
      # resolves inside Coolify's git clone directory, which is replaced on
      # every redeploy — the SQLite file would silently vanish and
      # GET /companies would return zero rows with no error, looking exactly
      # like an ingest that never ran (docs/deployment.md §4). A named volume
      # is host-managed and survives redeploys, and is what Coolify's backend
      # service -> Storages panel binds to at /data.
      - app_data:/data

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  app_data:
